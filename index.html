<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View Source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2efe8; --panel:#fffdf8; --ink:#1d2a2e; --muted:#6c7a7d; --line:#d9d4c7;
    --accent:#0f6b5c; --accent-ink:#fff; --tag:#0f6b5c; --str:#a8501f; --com:#8b968f; --end:#7a4b9c;
    --err:#b3261e;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14201f; --panel:#1b2b2a; --ink:#e6efe9; --muted:#8fa5a0; --line:#2c4240;
      --accent:#58d3b8; --accent-ink:#0b1a18; --tag:#58d3b8; --str:#f0a968; --com:#6f8a84; --end:#c9a2e8; --err:#ff8a80; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:20px 14px 40px}
  h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:-.01em}
  .sub{margin:0 0 16px;color:var(--muted);font-size:.95rem}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{flex:1 1 260px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-family:"IBM Plex Mono",monospace;font-size:.95rem}
  input[type=text]:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button{padding:12px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 1rem "IBM Plex Sans",sans-serif;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-size:.9rem;font-weight:500}
  button:disabled{opacity:.6;cursor:wait}
  #status{margin:14px 0 0;min-height:1.4em;font-size:.92rem;color:var(--muted)}
  #status.err{color:var(--err)}
  #result{display:none;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
  .meta{font-size:.85rem;color:var(--muted);word-break:break-all}
  .acts{display:flex;gap:8px}
  .code{display:flex;overflow:auto;max-height:75vh;font:400 13px/1.6 "IBM Plex Mono",ui-monospace,monospace}
  pre{margin:0;padding:12px 0}
  #gutter{position:sticky;left:0;padding:12px 10px 12px 12px;text-align:right;color:var(--muted);background:var(--panel);border-right:1px solid var(--line);user-select:none}
  #src{padding:12px 16px;white-space:pre;tab-size:2;flex:1}
  .t{color:var(--tag)} .s{color:var(--str)} .c{color:var(--com);font-style:italic} .e{color:var(--end)}
</style>
</head>
<body>
<main>
  <h1>View Source</h1>
  <p class="sub">Kisi bhi website ka link daalo, uska HTML source code yahan dikhega.</p>

  <form id="f">
    <input type="text" id="u" placeholder="example.com" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url" aria-label="Website link">
    <button id="go" type="submit">Get source</button>
  </form>
  <p id="status" role="status"></p>

  <section id="result">
    <div class="bar">
      <div class="meta" id="meta"></div>
      <div class="acts">
        <button class="ghost" id="copy" type="button">Copy</button>
        <button class="ghost" id="dl" type="button">Download</button>
      </div>
    </div>
    <div class="code"><pre id="gutter" aria-hidden="true"></pre><pre id="src"></pre></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let current = { html: '', host: 'page' };

function highlight(text) {
  const re = /<!--[\s\S]*?-->|<\/?[a-zA-Z][\w:-]*|\/?>|"[^"\n]*"|'[^'\n]*'/g;
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    const tok = m[0], safe = esc(tok);
    const cls = tok.startsWith('<!--') ? 'c' : tok[0] === '"' || tok[0] === "'" ? 's' : tok.startsWith('<') ? 't' : 'e';
    out += '<span class="' + cls + '">' + safe + '</span>';
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

function setStatus(msg, isErr) { const s = $('status'); s.textContent = msg; s.className = isErr ? 'err' : ''; }
const fmt = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(1) + ' KB';

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('u').value.trim();
  if (!url) return setStatus('Pehle link paste karo.', true);
  $('go').disabled = true; $('result').style.display = 'none'; setStatus('Fetching…');
  try {
    const r = await fetch('/api/source?url=' + encodeURIComponent(url));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Something went wrong.');
    const lines = d.html.split('\n').length;
    current = { html: d.html, host: new URL(d.finalUrl).hostname };
    $('meta').textContent = d.finalUrl + '  •  HTTP ' + d.status + '  •  ' + lines + ' lines  •  ' + fmt(d.bytes);
    $('gutter').textContent = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
    $('src').innerHTML = highlight(d.html);
    $('result').style.display = 'block';
    setStatus('');
  } catch (err) {
    setStatus(err.message, true);
  } finally { $('go').disabled = false; }
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(current.html); $('copy').textContent = 'Copied'; }
  catch { $('copy').textContent = 'Copy failed'; }
  setTimeout(() => ($('copy').textContent = 'Copy'), 1500);
});

$('dl').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([current.html], { type: 'text/html' }));
  a.download = current.host + '.html';
  a.click(); URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
